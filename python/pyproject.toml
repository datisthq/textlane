[project]
name = "textlane"
description = "Rust-native text processing pipeline — a unified replacement with native and JavaScript plugins"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.9"
keywords = ["ast", "html", "markdown", "mdx", "pipeline", "unified"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Markup",
]
# The version is the crate's: maturin reads it from the workspace in rust/
dynamic = ["version"]

[[project.authors]]
name = "Evgeny Karev"

[project.urls]
homepage = "https://textlane.dev"
repository = "https://github.com/datisthq/textlane"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "../rust/textlane/Cargo.toml"
features = ["python"]
module-name = "textlane"
# scripts/copy-skills.sh fills it; never committed
data = "textlane.data"
