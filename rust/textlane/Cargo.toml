[package]
name = "textlane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust-native text processing pipeline — a unified replacement with native and JavaScript plugins"
readme = "README.md"
keywords = ["markdown", "html", "mdx", "unified", "ast"]
categories = ["text-processing", "parser-implementations"]
include = ["src/**/*", "build.rs", "README.md", "LICENSE.md"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["md", "html", "mdx", "prose"]
md = ["dep:textlane-md"]
html = ["dep:textlane-html"]
mdx = ["dep:textlane-mdx"]
prose = ["dep:textlane-prose"]
node = ["md", "html", "mdx", "prose", "dep:napi", "dep:napi-derive", "dep:napi-build"]
python = ["md", "html", "mdx", "prose", "dep:pyo3"]
testing = []

[dependencies]
textlane-core = { workspace = true, features = ["json"] }
textlane-md = { workspace = true, optional = true }
textlane-html = { workspace = true, optional = true }
textlane-mdx = { workspace = true, optional = true }
textlane-prose = { workspace = true, optional = true }
napi = { version = "3.14.2", default-features = false, features = [
  "napi4",
], optional = true }
napi-derive = { version = "3.6.12", optional = true }
serde_json.workspace = true
serde.workspace = true
pyo3 = { version = "0.30.1", features = [
  "extension-module",
  "abi3-py39",
], optional = true }

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }

[lints]
workspace = true

[[test]]
name = "conformance"
required-features = ["testing"]

[dev-dependencies]
serde_json = "1.0.145"
