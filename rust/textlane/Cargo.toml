[package]
name = "textlane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust-native text processing pipeline — a unified replacement with native and JavaScript plugins"
readme = "README.md"
keywords = ["markdown", "html", "mdx", "unified", "ast"]
categories = ["text-processing", "parser-implementations"]
include = ["src/**/*", "build.rs", "README.md", "LICENSE.md"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["md", "html", "highlight", "katex", "mdx", "nl"]
md = ["dep:textlane-md"]
html = ["dep:textlane-html"]
highlight = ["html", "textlane-html/highlight"]
katex = ["html", "textlane-html/katex"]
mdx = ["dep:textlane-mdx"]
nl = ["dep:textlane-nl"]
node = [
  "md",
  "html",
  "highlight",
  "katex",
  "mdx",
  "nl",
  "dep:napi",
  "dep:napi-derive",
  "dep:napi-build",
]
python = ["md", "html", "highlight", "katex", "mdx", "nl", "dep:pyo3"]
testing = []
# The plugins' option schemas, read by `pnpm generate:bindings`; never in a release build
schema = [
  "dep:schemars",
  "textlane-md?/schema",
  "textlane-html?/schema",
  "textlane-mdx?/schema",
  "textlane-nl?/schema",
]

[dependencies]
textlane-core = { workspace = true, features = ["json"] }
textlane-md = { workspace = true, optional = true }
textlane-html = { workspace = true, optional = true }
textlane-mdx = { workspace = true, optional = true }
textlane-nl = { workspace = true, optional = true }
napi = { version = "3.14.2", default-features = false, features = [
  "napi4",
  "serde-json",
], optional = true }
napi-derive = { version = "3.6.12", optional = true }
serde_json.workspace = true
serde.workspace = true
serde_stacker.workspace = true
schemars = { workspace = true, optional = true }
pyo3 = { version = "0.30.1", features = [
  "extension-module",
  "abi3-py39",
], optional = true }

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }

[lints]
workspace = true

[[test]]
name = "conformance"
required-features = ["testing"]

[[example]]
name = "schema"
required-features = ["schema"]

[dev-dependencies]
serde_json = "1.0.145"
