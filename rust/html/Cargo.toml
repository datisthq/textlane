[package]
name = "textlane-html"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Textlane's HTML plugins: parsing, transforms, sanitizing and serializing"
keywords = ["html", "ast", "textlane"]
categories = ["text-processing", "parser-implementations"]

[features]
default = ["highlight", "katex"]
highlight = ["dep:giallo", "dep:regex"]
katex = ["dep:katex-rs"]
# The options' JSON Schema, which the bindings' types are generated from
schema = ["dep:schemars"]

[dependencies]
textlane-core = { workspace = true, features = ["json"] }
giallo = { workspace = true, optional = true }
katex-rs = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
bumpalo.workspace = true
serde.workspace = true
serde_json.workspace = true
stacker.workspace = true
memchr.workspace = true
url.workspace = true
linkify.workspace = true
schemars = { workspace = true, optional = true }

[lints]
workspace = true
