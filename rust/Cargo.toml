[workspace]
members = ["textlane", "core", "md", "html", "mdx", "nl"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/textlane"
homepage = "https://textlane.dev"

[workspace.dependencies]
textlane-core = { path = "core", version = "0.5.0" }
textlane-md = { path = "md", version = "0.5.0" }
textlane-html = { path = "html", version = "0.5.0", default-features = false }
textlane-nl = { path = "nl", version = "0.5.0" }
textlane-mdx = { path = "mdx", version = "0.5.0" }
bumpalo = { version = "3.19.0", features = ["collections"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "unbounded_depth"] }
serde_stacker = "0.1.14"
regex = { version = "1.11.1", default-features = false, features = [
  "std",
  "perf",
  "unicode",
] }
stacker = "0.1.21"
memchr = "2.8.3"
schemars = "1.2.3"
giallo = { version = "0.5.2", features = ["dump"] }
# Exact: html.katex works around this version's attribute order
katex-rs = "=0.3.0"
url = "2.5.4"
unicode-id-start = "1.5.0"
yaml-rust2 = { version = "0.13.0", default-features = false }
oxc_allocator = "0.155.0"
oxc_ast = { version = "0.155.0", features = ["serialize"] }
oxc_ast_visit = "0.155.0"
oxc_diagnostics = "0.155.0"
oxc_parser = "0.155.0"
oxc_semantic = "0.155.0"
oxc_span = "0.155.0"
oxc_syntax = "0.155.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true

# A copy of a dependency with a fix textlane needs, until upstream ships it: the npm and
# PyPI addons build with it; a crates.io build takes the published crate
[patch.crates-io]
onig-regset = { path = "vendor/onig-regset" }
