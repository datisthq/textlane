[workspace]
members = ["textlane", "core", "md", "html", "mdx", "prose"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/textlane"
homepage = "https://textlane.dev"

[workspace.dependencies]
textlane-core = { path = "core", version = "0.0.0" }
textlane-md = { path = "md", version = "0.0.0" }
textlane-html = { path = "html", version = "0.0.0", default-features = false }
textlane-prose = { path = "prose", version = "0.0.0" }
textlane-mdx = { path = "mdx", version = "0.0.0" }
bumpalo = { version = "3.19.0", features = ["collections"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
regex = { version = "1.11.1", default-features = false, features = [
  "std",
  "perf",
  "unicode",
] }
stacker = "0.1.21"
memchr = "2.8.3"
schemars = "1.2.3"
giallo = { version = "0.5.2", features = ["dump"] }
url = "2.5.4"
unicode-id-start = "1.5.0"
oxc_allocator = "0.155.0"
oxc_ast = { version = "0.155.0", features = ["serialize"] }
oxc_ast_visit = "0.155.0"
oxc_diagnostics = "0.155.0"
oxc_parser = "0.155.0"
oxc_semantic = "0.155.0"
oxc_span = "0.155.0"
oxc_syntax = "0.155.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
