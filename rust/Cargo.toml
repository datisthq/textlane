[workspace]
members = ["textlane", "core", "markdown", "html", "prose", "javascript"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/textlane"
homepage = "https://textlane.dev"

[workspace.dependencies]
textlane-core = { path = "core", version = "0.0.0" }
textlane-markdown = { path = "markdown", version = "0.0.0" }
textlane-html = { path = "html", version = "0.0.0" }
textlane-prose = { path = "prose", version = "0.0.0" }
textlane-javascript = { path = "javascript", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
