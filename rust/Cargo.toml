[package]
name = "textlane"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Rust-native text processing pipeline — a unified replacement with native and JavaScript plugins"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/textlane"
homepage = "https://textlane.dev"
readme = "README.md"
keywords = ["markdown", "html", "mdx", "unified", "ast"]
categories = ["text-processing", "parser-implementations"]
include = ["src/**/*", "build.rs", "README.md", "LICENSE.md"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
node = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
python = ["dep:pyo3"]

[dependencies]
napi = { version = "3.14.2", default-features = false, features = [
  "napi4",
], optional = true }
napi-derive = { version = "3.6.12", optional = true }
pyo3 = { version = "0.30.1", features = [
  "extension-module",
  "abi3-py39",
], optional = true }

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
